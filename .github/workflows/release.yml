# Cut a release. Pushing a tag like v0.1.0 builds the release binaries, writes
# a checksums file, and publishes a GitHub release with all of them attached.
# The version in `sluice version` is stamped from the tag.
name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Verify before releasing
        run: |
          make lint
          go test -count=1 ./...

      - name: Build release binaries
        run: make dist VERSION=${{ github.ref_name }} COMMIT=$(git rev-parse --short HEAD) DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            dist/*
